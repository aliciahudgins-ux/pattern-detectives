<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Detectives • Guided Practice</title>
<style>
:root{--ink:#152d43;--navy:#102c40;--teal:#087d81;--mint:#d9f3e9;--gold:#ffd46b;--line:#cbd7db}*{box-sizing:border-box}body{margin:0;background:#eaf0f0;color:var(--ink);font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--navy);color:white}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible{outline:4px solid #e69b24;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.light{background:white;color:var(--ink);border:1px solid var(--line)}.gold{background:var(--gold);color:var(--ink)}.teal{background:var(--teal)}header{background:var(--navy);color:white;padding:15px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between}header strong{font-size:20px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font-size:13px;padding:9px 12px;background:#24485d}main{max-width:1240px;margin:auto;padding:22px}h1{font-size:clamp(36px,5vw,64px);line-height:1.02;margin:14px 0}h2{font-size:30px;margin:8px 0 14px}p{line-height:1.5}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:900;color:var(--teal)}.hero{background:#fffdf6;border-radius:24px;padding:36px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px}.hero p{font-size:19px}.badge{display:inline-block;border:2px solid var(--teal);border-radius:99px;padding:6px 12px;color:var(--teal);font-weight:bold;font-size:13px}.art{background:var(--navy);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:280px;color:white}.glass{font-size:100px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.tile,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.tile b{display:block;font-size:19px;margin-bottom:10px}.tile p{font-size:15px;margin:0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.layout{display:grid;grid-template-columns:minmax(430px,1.1fr) minmax(320px,.9fr);gap:22px;align-items:start}.chartbox{background:white;border-radius:18px;padding:18px;border:1px solid var(--line)}table.chart{border-collapse:collapse;width:100%;table-layout:fixed;text-align:center;font-size:clamp(15px,2vw,24px);font-weight:700}table.chart td,table.chart th{border:1px solid #aabac2;height:40px;padding:2px}table.chart th{background:var(--navy);color:white}table.chart .shade{background:#d4eeec}table.chart .proof{background:var(--gold)}table.chart .hole{background:var(--navy);color:white}table.chart .found{background:#bde9d7;color:#123e31}.chartlabel{font-size:12px;font-weight:bold;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;color:#527080}.prompt{font-size:clamp(23px,2.6vw,34px);font-weight:800;line-height:1.25;margin:16px 0}.sub{font-size:17px;line-height:1.5;color:#426071}.options{display:grid;gap:9px;margin:16px 0}.option{background:#f2f5f5;border:1px solid var(--line);padding:12px 14px;border-radius:10px;font-size:20px}.option.right{background:var(--mint);border:2px solid var(--teal)}.answer{background:var(--mint);border-left:5px solid var(--teal);border-radius:12px;padding:16px;margin-top:16px}.answer b{font-size:22px}.answer p{font-size:17px;margin:8px 0 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px;flex-wrap:wrap}.dots{display:flex;gap:5px}.dot{width:19px;height:9px;background:#c3d0d4;border-radius:9px}.dot.done{background:var(--teal)}.dot.current{background:#e9ad32}.timer{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 0}.clock{font-size:26px;font-variant-numeric:tabular-nums;font-weight:900;min-width:70px}.timer button{font-size:13px;padding:9px 12px}.note{background:#fff4ce;border-radius:12px;padding:14px;line-height:1.45;margin:16px 0}.clues{display:flex;gap:8px;align-items:center}.clue{background:var(--navy);color:var(--gold);font-size:24px;font-weight:900;padding:7px 13px;border-radius:9px}.center{text-align:center}.envelope{font-size:110px;display:block;margin:15px}.lockinput{font-size:38px;text-align:center;letter-spacing:12px;width:200px;padding:12px;border:2px solid var(--teal);border-radius:12px}.reward{font-size:clamp(32px,5vw,60px);font-weight:900;color:var(--teal)}.confetti{position:fixed;top:-20px;z-index:10;pointer-events:none;animation:fall 3s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}.hidden{display:none!important}.paper{max-width:760px;background:white;margin:18px auto;padding:30px;border:1px solid var(--line)}.paper h2{font-size:25px}.paper h3{font-size:19px}.paper .chart{font-size:18px}.paper .chart td,.paper .chart th{height:30px}.record{display:grid;grid-template-columns:1fr 1fr;gap:10px}.record>div{border:1px solid #b1bdc4;border-radius:7px;padding:8px;min-height:94px;font-size:14px}.writing{border-bottom:1px solid #9aaab2;height:22px}details{margin:12px 0}summary{cursor:pointer;font-weight:800;padding:10px 0}li{line-height:1.5;margin:7px 0}
@media(max-width:850px){.hero,.layout{grid-template-columns:1fr}.art{min-height:200px}.tiles{grid-template-columns:1fr}header{align-items:start;padding:12px}main{padding:14px}.hero{padding:24px}table.chart td,table.chart th{height:34px}}@media print{@page{size:letter;margin:.45in}body{background:white}header,.no-print,#game{display:none!important}#materials{display:block!important}main{max-width:none;padding:0}.paper{border:0;padding:0;margin:0;max-width:none;break-after:page}.paper:last-child{break-after:auto}.paper .chart td,.paper .chart th{height:28px;color:black;background:white}.paper h2{margin-top:0}.record>div{min-height:94px;break-inside:avoid}.paper p{font-size:13px}}
</style></head><body><header><strong>🔎 PATTERN DETECTIVES</strong><nav aria-label="Game tools"><button onclick="home()">Home</button><button onclick="materials()">Print & teacher guide</button><button id="soundButton" onclick="toggleSound()">Sound: ON</button><button onclick="fullscreen()">⛶ Full screen</button></nav></header><main><section id="game"></section><section id="materials" class="hidden"></section></main><script>
const $=id=>document.getElementById(id);let page='home',index=0,revealed=false,solved=new Set(),sound=true,audioContext,seconds=60,ticking=null;
const cases=[
{round:0,type:'hundred',start:1,holes:[13,23,33,43],shade:[3,13,23,33,43,53,63,73,83,93],title:'The vanishing column',q:'Find the four missing numbers. Are they all odd, all even, or alternating?',answer:'13, 23, 33, 43 — all odd.',why:'Moving down one space adds 10. Each missing number has 3 in the ones place.',record:'Missing numbers: __________________<br>Odd/even: __________________'},
{round:0,type:'hundred',start:1,holes:[26,36,46,56],shade:[6,16,26,36,46,56,66,76,86,96],title:'An even stranger mystery',q:'Find the four missing numbers. Describe their odd/even pattern.',answer:'26, 36, 46, 56 — all even.',why:'The numbers increase by 10. Each missing number has 6 in the ones place.',record:'Missing numbers: __________________<br>Odd/even: __________________'},
{round:0,type:'multiply',holes:[[4,6]],shadeCol:6,title:'The sixes secret',q:'A number is missing in the 6’s column. Find it and tell how much the numbers increase as you move down.',answer:'24; add 6 each time.',why:'The column goes 6, 12, 18, 24, 30… The missing number is 18 + 6 = 24.',proof:[[3,6],[4,6],[5,6]],record:'Missing number: ____<br>Rule: ___________________________'},
{round:0,type:'multiply',holes:[[4,7],[7,4]],shadeCol:7,shadeRow:7,title:'The equation evidence',q:'Which equation uses 21 and the column’s pattern to find the missing number below 21?',options:['7 × 3','7 + 7','21 + 7','21 − 7'],correct:2,answer:'C. 21 + 7 = 28',why:'The 7’s column increases by 7: 7, 14, 21, 28, 35. The other empty space also holds 28 because 7 × 4 = 4 × 7.',proof:[[3,7],[4,7],[7,4]],record:'Letter: ____<br>Equation: _______________________'},
{round:1,type:'hundred',start:0,shade:[2,12,22,32,42,52,62,72,82,92],title:'Beyond the board',q:'The shaded pattern ends at 92. What are the next FOUR numbers?',answer:'102, 112, 122, 132',why:'Keep adding 10 after 92. The first NEW number is 102; do not list 92 again.',record:'Next four numbers:<br>_______________________________'},
{round:1,type:'hundred',start:1,shade:[7,17,27,37,47,57,67,77,87,97],title:'The trail of sevens',q:'The shaded pattern ends at 97. What are the next FOUR numbers?',answer:'107, 117, 127, 137',why:'Add 10 each time. The ones digit stays 7, even beyond 100.',record:'Next four numbers:<br>_______________________________'},
{round:1,type:'multiply',shadeCol:4,title:'Four steps forward',q:'Continue the 4’s column beyond 40. Write the next FOUR numbers.',answer:'44, 48, 52, 56',why:'Add 4 each time: 40 + 4 = 44, then 48, 52, 56.',record:'Next four numbers:<br>_______________________________'},
{round:1,type:'multiply',shadeCol:3,title:'Odd… then even?',q:'Look at the 3’s column from top to bottom. Describe its odd/even pattern. What number follows 30?',answer:'Odd, even, odd, even… Next: 33.',why:'Adding 3 switches between odd and even. After 30 comes 33, an odd number.',record:'Odd/even pattern: _______________<br>Next number: ____'},
{round:2,type:'multiply',shadeCols:[5,10],title:'Half of the evidence',q:'TRUE or FALSE? In each row, the number in the 5’s column is half the number in the 10’s column.',answer:'TRUE',why:'Compare matching rows: 5 is half of 10; 15 is half of 30; 35 is half of 70. In every row, ×10 gives twice as much as ×5.',proof:[[1,5],[1,10],[3,5],[3,10],[7,5],[7,10]],record:'True/false: ____<br>Evidence: ______________________'},
{round:2,type:'multiply',shadeCols:[2,5],title:'The trickster’s claim',q:'TRUE or FALSE? Every number in the 5’s column also appears in the 2’s column on this chart.',answer:'FALSE',why:'5 is in the 5’s column, but it is not in the 2’s column. The 2’s column contains only even numbers. One example is enough to disprove “every.”',proof:[[1,5],[3,5]],record:'True/false: ____<br>A number that disproves it: ____'},
{round:2,type:'hundred',start:1,shade:[4,14,24,34,44,54,64,74,84,94],title:'One tiny mistake',q:'TRUE or FALSE? Moving down one space in the shaded column adds 1. If false, fix the rule.',answer:'FALSE — moving down adds 10.',why:'For example, 14 + 10 = 24. Moving right one space within a row adds 1.',record:'True/false: ____<br>Correct rule: ___________________'},
{round:2,type:'multiply',shadeCols:[3,6],title:'The double agent',q:'TRUE or FALSE? In each row, the number in the 6’s column is double the number in the 3’s column.',answer:'TRUE',why:'Compare matching rows: 3 and 6; 12 and 24; 24 and 48. Multiplying by 6 gives twice as much as multiplying by 3.',proof:[[1,3],[1,6],[4,3],[4,6],[8,3],[8,6]],record:'True/false: ____<br>Evidence: ______________________'}];
const rounds=['Find the missing numbers','Follow the trail','Catch the chart trickster'],digits=['2','4','7'];
function tone(freq,duration=.15,delay=0,wave='sine'){if(!sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+delay;o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function chime(){[523,659,784].forEach((f,i)=>tone(f,.2,i*.12))}function alarm(){for(let i=0;i<8;i++)tone(i%2?660:880,.22,i*.26,'square')}function toggleSound(){sound=!sound;$('soundButton').textContent='Sound: '+(sound?'ON':'OFF');if(sound)tone(660)}function stopTimer(){clearInterval(ticking);ticking=null}function setTime(n){stopTimer();seconds=n;if($('timerMessage'))$('timerMessage').textContent='';updateClock()}function updateClock(){if($('clock'))$('clock').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if($('timerButton'))$('timerButton').textContent=ticking?'Pause':'Start'}function timer(){if(ticking){stopTimer();updateClock();return}if(seconds<=0)seconds=60;$('timerMessage').textContent='';tone(440,.05);ticking=setInterval(()=>{seconds--;if(seconds<=0){stopTimer();alarm();$('timerMessage').textContent='TIME! Markers down. Keep your answer.'}updateClock()},1000);updateClock()}
function chart(c,show=false){let h='<div class="chartlabel">'+(c.type==='multiply'?'Multiplication chart · 1–10':'Hundreds chart · '+c.start+'–'+(c.start+99))+'</div><table class="chart" aria-label="'+(c.type==='multiply'?'Multiplication chart':'Hundreds chart')+'">';if(c.type==='multiply'){h+='<tr><th scope="col">×</th>';for(let col=1;col<=10;col++)h+='<th scope="col">'+col+'</th>';h+='</tr>';for(let row=1;row<=10;row++){h+='<tr><th scope="row">'+row+'</th>';for(let col=1;col<=10;col++){let hole=(c.holes||[]).some(p=>p[0]===row&&p[1]===col),shade=c.shadeCol===col||c.shadeRow===row||(c.shadeCols||[]).includes(col),proof=show&&(c.proof||[]).some(p=>p[0]===row&&p[1]===col);h+='<td class="'+(hole?(show?'found':'hole'):proof?'proof':shade?'shade':'')+'">'+(hole&&!show?'?':row*col)+'</td>'}h+='</tr>'}}else{for(let r=0;r<10;r++){h+='<tr>';for(let col=0;col<10;col++){let n=c.start+r*10+col,hole=(c.holes||[]).includes(n);h+='<td class="'+(hole?(show?'found':'hole'):(c.shade||[]).includes(n)?'shade':'')+'">'+(hole&&!show?'?':n)+'</td>'}h+='</tr>'}}return h+'</table>'}
function showGame(){$('materials').classList.add('hidden');$('game').classList.remove('hidden')}
function home(){stopTimer();page='home';showGame();$('game').innerHTML=`<div class="hero"><div><span class="badge">GUIDED PRACTICE • DETECTIVE ACADEMY</span><h1>Something<br>doesn’t add up.</h1><p>The Chart Trickster has hidden numbers and left some suspicious claims. Find the patterns. Prove your thinking. Crack the final code.</p><div class="actions"><button class="gold" onclick="discovery()">Start discovery hunt →</button><button class="light" onclick="openCase()">${solved.size?'Resume mysteries':'Begin guided practice'}</button></div><p style="font-size:14px">Teacher led • 12 mysteries • Charts + markers or whiteboards</p></div><div class="art"><span class="glass">🔎</span><span style="font-size:24px;font-weight:900">12 mysteries. 3 clues.</span><span style="margin-top:10px;color:#bcd5db">One secret envelope.</span></div></div><div class="tiles"><div class="tile"><b>01 · Find</b><p>Recover missing numbers and describe their patterns.</p></div><div class="tile"><b>02 · Follow</b><p>Track a pattern beyond the edge of the chart.</p></div><div class="tile"><b>03 · Prove</b><p>Catch false claims using number evidence.</p></div></div><div class="note"><b>Detective rule:</b> Everyone records an answer before the teacher reveals it. Explain with number evidence.</div><div class="actions"><button class="light" onclick="materials()">Student pages & teacher guide</button><button class="light" onclick="resetGame()">Reset progress</button></div>`}
function resetGame(){if(confirm('Clear the completed mysteries and start over?')){solved.clear();index=0;home()}}
function discovery(){stopTimer();page='discovery';showGame();$('game').innerHTML=`<div class="bar"><span class="eyebrow">Before the cases · discovery hunt</span><button class="light" onclick="openCase()">Begin guided practice →</button></div><h2>What patterns can you uncover?</h2><div class="layout"><div class="chartbox">${chart({type:'hundred',start:1})}<details><summary>Show multiplication chart</summary>${chart({type:'multiply'})}</details></div><div class="panel"><span class="badge">LOOK • MARK • EXPLAIN</span><p class="prompt">Find evidence on your charts.</p><ol class="sub"><li>On the hundreds chart, move down one space. What changes?</li><li>Find a column with only odd numbers. Find one with only even numbers.</li><li>On the multiplication chart, trace the 7’s column. How much does it increase?</li><li>Compare the 5’s and 10’s columns in the same row. What do you notice?</li></ol><button class="teal" onclick="this.nextElementSibling.classList.toggle('hidden');chime()">Reveal discoveries</button><div class="answer hidden"><b>Patterns to keep!</b><p>Hundreds chart: down +10; across a row +1. Numbers in a column share a ones digit and stay odd or stay even.</p><p>Multiplication chart: the 7’s column adds 7. In each row, the 10’s entry is double the 5’s entry.</p></div></div></div>`}
function earned(r){return [0,1,2,3].every(n=>solved.has(r*4+n))}function clues(){return '<div class="clues"><span style="font-size:12px;font-weight:bold">CODE</span>'+digits.map((d,r)=>'<span class="clue">'+(earned(r)?d:'?')+'</span>').join('')+'</div>'}
function openCase(){stopTimer();seconds=60;revealed=solved.has(index);page='case';showGame();renderCase()}
function renderCase(){const c=cases[index],tf=c.round===2;$('game').innerHTML=`<div class="bar"><div><span class="eyebrow">Guided practice · Round ${c.round+1} · ${rounds[c.round]}</span><h2>Case ${index+1}: ${c.title}</h2></div>${clues()}</div><div class="bar"><div class="dots" aria-label="${solved.size} of 12 mysteries revealed">${cases.map((_,i)=>'<span class="dot '+(i===index?'current':solved.has(i)?'done':'')+'"></span>').join('')}</div><span>Write first • Explain • Reveal</span></div><div class="layout"><div class="chartbox">${chart(c,revealed)}</div><div class="panel"><span class="badge">${tf?'CATCH THE TRICKSTER':'YOUR MISSION'}</span><p class="prompt">${c.q}</p>${c.options?'<div class="options">'+c.options.map((o,i)=>'<div class="option '+(revealed&&i===c.correct?'right':'')+'"><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</div>').join('')+'</div>':''}<div class="sub">${tf?'Write TRUE or FALSE first. Then stand for true or crouch for false. Show your evidence.':'Everyone: record your answer. Be ready to point to number evidence on the chart.'}</div><div class="timer"><span id="clock" class="clock"></span><button id="timerButton" onclick="timer()">Start</button><button class="light" onclick="setTime(60)">60 sec</button><button class="light" onclick="setTime(90)">90 sec</button></div><div id="timerMessage" style="font-weight:bold;color:#b34423" role="status"></div><button class="gold" onclick="reveal()" ${revealed?'disabled':''}>🔎 Reveal answer & evidence</button>${revealed?'<div class="answer" role="status"><b>'+c.answer+'</b><p>'+c.why+'</p></div>':''}${revealed&&earned(c.round)&&(index+1)%4===0?'<div class="note"><b>Round complete! Code digit '+(c.round+1)+': '+digits[c.round]+'</b><br>Record this digit on your sheet.</div>':''}<div class="actions"><button class="light" onclick="previous()" ${index===0?'disabled':''}>← Back</button><button onclick="next()" ${!revealed?'disabled':''}>${index===11?'Open the final envelope →':'Next mystery →'}</button></div></div></div>`;updateClock()}
function reveal(){if(revealed)return;stopTimer();revealed=true;solved.add(index);chime();renderCase()}function next(){if(!revealed)return;if(index<11){index++;openCase()}else finale()}function previous(){if(index>0){index--;openCase()}}
function finale(){stopTimer();showGame();page='finale';$('game').innerHTML=`<div class="panel center" style="max-width:800px;margin:20px auto;padding:35px"><span class="badge">THE FINAL ENVELOPE</span><span class="envelope">✉️</span><h2>Patterns found. Evidence collected.</h2><p class="sub">Enter your three code digits in round order.</p><div style="display:flex;justify-content:center;margin:22px">${clues()}</div><form onsubmit="event.preventDefault();unlock()"><input id="code" class="lockinput" aria-label="Three-digit code" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="•••"><div class="actions" style="justify-content:center"><button class="gold" type="submit">Unlock envelope 🔓</button></div></form><p id="lockMessage" role="status"></p><button class="light" onclick="index=11;openCase()">← Return to last case</button></div>`}
function unlock(){if($('code').value.trim()!=='247'){$('lockMessage').textContent='Check your digits. Use round 1, then round 2, then round 3.';tone(180,.25);return}if(![0,1,2].every(earned)){$('lockMessage').textContent='Finish all three rounds to collect the evidence first.';return}celebrate();$('game').innerHTML=`<div class="panel center" style="padding:40px;max-width:900px;margin:auto"><span class="badge">CASE CLOSED</span><p style="font-size:80px;margin:12px">🏆 🔎 🎉</p><div class="reward">Certified Pattern Detectives!</div><p class="sub">You recovered the numbers, followed the trails,<br>and caught the Chart Trickster using evidence.</p><div class="note"><h2>Your mystery reward</h2><p style="font-size:26px;margin:0">A 2-minute celebration dance break!</p></div><p>Before the break, share one chart rule you can prove.</p><div class="actions" style="justify-content:center"><button class="gold" onclick="celebrate()">Celebrate again!</button><button class="light" onclick="materials()">Student pages & teacher guide</button><button onclick="home()">Home</button></div></div>`}
function celebrate(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,i*.18));if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<65;i++){let el=document.createElement('span');el.className='confetti';el.textContent=['★','●','■'][i%3];el.style.left=Math.random()*100+'vw';el.style.color=['#e9ad32','#087d81','#ed7092','#517adb'][i%4];el.style.fontSize=12+Math.random()*20+'px';el.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),4000)}}function fullscreen(){if(document.fullscreenElement){document.exitFullscreen?.();return}document.documentElement.requestFullscreen?.().catch(()=>{})}
function materials(){stopTimer();$('game').classList.add('hidden');$('materials').classList.remove('hidden');$('materials').innerHTML=`<div class="no-print panel"><h2>Ready for guided practice</h2><p>Print the three student pages below: evidence log, hundreds charts, and multiplication chart. Chart pages can be placed in sleeves for reuse.</p><div class="actions"><button class="gold" onclick="window.print()">Print student pages</button><button class="light" onclick="page==='case'?openCase():home()">Return to game</button></div><details open><summary>Teacher guide · 30–35 minutes</summary><ol><li><b>Prepare:</b> Project this game. Give everyone a recording sheet and access to the chart pages or classroom charts.</li><li><b>Discover:</b> Use the optional opening hunt to model how to find and explain patterns.</li><li><b>Guided practice:</b> Read each mission aloud. Give everyone thinking time to write an answer. Ask students to explain using numbers on the chart, then reveal and discuss the answer. The timer is optional.</li><li><b>Round 3:</b> Students write first, then stand for true or crouch for false. Seated thumbs-up/thumbs-down works too.</li><li><b>Clues:</b> After cases 4, 8, and 12, students record the code digits. Use 247 to open the final envelope and earn a 2-minute dance break.</li><li><b>Close:</b> Ask students to share one rule and two numbers that demonstrate it.</li></ol><p><b>Watch for:</b> Hundreds-chart columns add 10. Multiplication columns add the column header. Compare entries within the SAME row for doubles and halves. “Next four” begins after the last number shown.</p><p><b>Support:</b> Trace one column and read its numbers together. Use “I notice ____. My evidence is ____.” Teacher-controlled reveals advance the game; student responses are not graded automatically. Progress lasts until the page is refreshed or closed.</p></details><details><summary>Answer key</summary><ol>${cases.map(c=>'<li><b>'+c.answer+'</b> '+c.why+'</li>').join('')}</ol></details></div><div class="paper"><span class="eyebrow">Guided practice · student evidence log</span><h2>Pattern Detectives</h2><p>Name: ____________________________________</p><p><b>Write your answer before the reveal.</b> Use your charts to find evidence.</p><div class="record">${cases.map((c,i)=>'<div><b>'+(i+1)+'. '+c.title+'</b><p style="margin:6px 0">'+c.record+'</p><div class="writing"></div></div>').join('')}</div><p><b>Code digits:</b> Round 1 [____] &nbsp; Round 2 [____] &nbsp; Round 3 [____]</p><p><b>One chart rule I can prove:</b> _________________________________________</p><div class="writing"></div></div><div class="paper"><h2>Detective Tools: Hundreds Charts</h2><p>Name: ____________________________________</p>${chart({type:'hundred',start:1})}<div style="height:20px"></div>${chart({type:'hundred',start:0})}<p><b>Look closely:</b> One chart starts at 1; the other starts at 0.</p></div><div class="paper"><h2>Detective Tools: Multiplication Chart</h2><p>Name: ____________________________________</p>${chart({type:'multiply'})}<h3>Evidence notes</h3><p>I notice ____________________________________________________________</p><div class="writing"></div><p>My number evidence is _______________________________________________</p><div class="writing"></div><p>I can prove it because __________________________________________________</p><div class="writing"></div><p><b>Remember:</b> Use row and column headers. Compare entries in the same row when looking for doubles or halves.</p></div>`}
home();
